services:
  - type: web
    name: codeconnect-chatapp
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm ci --prefix backend --include=dev && npm ci --prefix frontend --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MESSAGE_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JUDGE0_API_URL
        value: https://ce.judge0.com
